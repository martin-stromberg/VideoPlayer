name: Pre-Release

# Filename stays staging-ci.yml (only the display name changes to "Pre-Release") - see
# ci-target-schema.md section 3. staging-to-main-promotion.yml's workflow_run trigger
# references this display name, not the filename; both were updated together in this same
# commit so the promotion chain never briefly points at a name that no longer exists.

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-ci
  cancel-in-progress: true

permissions:
  contents: write
  checks: write

jobs:
  detect-backmerge:
    # Same thorough check as pr-staging-ci.yml's detect-backmerge (decision 20): checks both
    # merge-parent and tree-diff against main. On a push event HEAD is the pushed commit
    # itself (not a synthetic merge), so this mainly catches the case where the automated
    # back-merge PR (main -> staging) was merged with "Create a merge commit", making main's
    # tip a direct parent of the new staging HEAD.
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this push is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          is_main_merge_parent=false
          for parent in $(git show -s --format=%P HEAD); do
            if [[ "$parent" == "$main_sha" ]]; then
              is_main_merge_parent=true
              break
            fi
          done

          if [[ "$is_main_merge_parent" == "true" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoPlayer.sln

      - name: Format check
        # See pr-staging-ci.yml's equivalent step for why --severity error is used here.
        run: dotnet format VideoPlayer.sln --verify-no-changes --no-restore --severity error

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          solution-path: VideoPlayer.sln
          artifact-name: vulnerable-packages-staging

      - name: Static analysis
        # See pr-staging-ci.yml's equivalent step for why these codes are excluded, and why
        # %3B (MSBuild's own escape for ";") is used instead of a literal semicolon.
        run: >
          dotnet build VideoPlayer.sln -c Debug --no-restore -p:TreatWarningsAsErrors=true
          "-p:WarningsNotAsErrors=NU1903%3BCS8601%3BCS8602%3BCS8603%3BCS8604%3BCS8618%3BCS8620%3BCS8629%3BCS0436%3BCS0414%3BBL0008"

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoPlayer.sln

      - name: Build test project
        run: dotnet build VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --no-restore -c Release -p:NoWarn=NU1903

      - name: Install Playwright browsers
        run: pwsh VideoWebPlayer.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run unit tests
        run: dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --no-build -c Release --filter "Category!=E2E" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      - name: Run integration tests
        run: dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --no-build -c Release --filter "Category=Integration" --logger "trx;LogFileName=integration-test-results.trx" --logger "console;verbosity=normal"

      - name: Run E2E tests
        run: dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --no-build -c Release --filter "Category=E2E" --logger "trx;LogFileName=e2e-test-results.trx" --logger "console;verbosity=normal"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: reportgenerator "-reports:VideoWebPlayer.Tests/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"

      - name: Enforce coverage threshold
        env:
          COVERAGE_THRESHOLD: '70'
        run: |
          set -euo pipefail
          summary="$(cat coverage-report/Summary.txt)"
          line_coverage="$(printf '%s\n' "$summary" | grep -oE 'Line coverage:[[:space:]]*[0-9]+([.,][0-9]+)?%' | grep -oE '[0-9]+([.,][0-9]+)?' | tr ',' '.')"
          if [ -z "$line_coverage" ]; then
            echo "::error::Could not determine line coverage from the generated report."
            exit 1
          fi
          echo "Line coverage: ${line_coverage}% (threshold: ${COVERAGE_THRESHOLD}%)"
          if awk "BEGIN { exit !($line_coverage < $COVERAGE_THRESHOLD) }"; then
            echo "::error::Code coverage ${line_coverage}% is below the required threshold of ${COVERAGE_THRESHOLD}%."
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-staging
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-staging
          path: VideoWebPlayer.Tests/TestResults/*.trx
          retention-days: 14

  version:
    name: version
    needs: [detect-backmerge, static-checks, build-and-test]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      rc_tag: ${{ steps.rc.outputs.rc_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Determine next version
        # release.config.js only lists "main" as a release branch (see that file's own
        # comment); staging is deliberately not a configured prerelease branch there. The
        # --branches override below treats "staging" as a plain release branch for this one
        # dry-run only, so the resulting X.Y.Z carries no prerelease identifier - the RC
        # suffix is appended manually in the next step instead. This replaces the previous
        # .github/scripts/compute-version.sh custom Conventional-Commits script.
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output="$(npx semantic-release --dry-run --no-ci --branches staging 2>&1 | tee /dev/stderr)"

          version=""
          changed="false"
          if [[ "$output" =~ The\ next\ release\ version\ is\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?) ]]; then
            version="${BASH_REMATCH[1]}"
            changed="true"
            echo "Next release version: $version"
          else
            echo "No new release version determined."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Determine RC number
        if: steps.semver.outputs.changed == 'true'
        id: rc
        run: |
          set -euo pipefail
          version="${{ steps.semver.outputs.version }}"
          rc_number=$(( $(git tag --list "v${version}-rc.*" | wc -l) + 1 ))
          echo "rc_number=$rc_number" >> "$GITHUB_OUTPUT"
          echo "rc_tag=v${version}-rc.${rc_number}" >> "$GITHUB_OUTPUT"

  prerelease:
    name: prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and package release candidate
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ needs.version.outputs.version }}
          release-tag: ${{ needs.version.outputs.rc_tag }}

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.rc_tag }}"
          gh release create "$tag" release-win-x64.zip release-linux-x64.zip update.json \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --prerelease \
            --generate-notes
