name: Main Branch Release

on:
  push:
    branches: [ main ]

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.get_version.outputs.release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from git tag
        id: get_version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0-RC.1")
          
          # Remove 'v' prefix and -RC suffix to get clean version
          CLEAN_VERSION=${LATEST_TAG#v}
          RELEASE_VERSION=${CLEAN_VERSION%-RC*}
          
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted release version: $RELEASE_VERSION from tag: $LATEST_TAG"

  build-release:
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer/VideoWebPlayer.csproj

      - name: Build solution
        run: dotnet build VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --no-restore /p:NoWarn=NU1903

      - name: Update version to release version
        run: |
          RELEASE_VERSION="${{ needs.extract-version.outputs.release_version }}"
          
          # Update AssemblyVersion and FileVersion in project files
          find . -name "*.csproj" -type f -exec sed -i "s/<AssemblyVersion>.*<\/AssemblyVersion>/<AssemblyVersion>${RELEASE_VERSION}<\/AssemblyVersion>/g" {} \;
          find . -name "*.csproj" -type f -exec sed -i "s/<FileVersion>.*<\/FileVersion>/<FileVersion>${RELEASE_VERSION}<\/FileVersion>/g" {} \;
          
          # Update Version element to release version (without RC suffix)
          for proj in $(find . -name "*.csproj" -type f); do
            if grep -q "<Version>" "$proj"; then
              sed -i "s/<Version>.*<\/Version>/<Version>${RELEASE_VERSION}<\/Version>/g" "$proj"
            fi
          done

      - name: Publish Windows artifact
        run: |
          dotnet publish VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --runtime win-x64 --self-contained -o artifacts/windows /p:Version=${{ needs.extract-version.outputs.release_version }} /p:NoWarn=NU1903

      - name: Publish Linux artifact
        run: |
          dotnet publish VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --runtime linux-x64 --self-contained -o artifacts/linux /p:Version=${{ needs.extract-version.outputs.release_version }} /p:NoWarn=NU1903

      - name: Create release zip (Windows)
        run: |
          cd artifacts/windows
          zip -r ../../release-windows-${{ needs.extract-version.outputs.release_version }}.zip .

      - name: Create release zip (Linux)
        run: |
          cd artifacts/linux
          zip -r ../../release-linux-${{ needs.extract-version.outputs.release_version }}.zip .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-windows-${{ needs.extract-version.outputs.release_version }}.zip

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-linux-${{ needs.extract-version.outputs.release_version }}.zip

  final-tests:
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj

      - name: Build test project
        run: dotnet build VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release /p:NoWarn=NU1903

      - name: Run final test suite
        run: dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=final-test-results.trx"

      - name: Run MAUI tests
        run: dotnet test VideoWebPlayer.Maui.Tests/VideoWebPlayer.Maui.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=final-maui-test-results.trx"
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-test-results
          path: '**/*final-test-results.trx'

  create-github-release:
    runs-on: ubuntu-latest
    needs: [extract-version, build-release, final-tests]
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.extract-version.outputs.release_version }}
          name: Release v${{ needs.extract-version.outputs.release_version }}
          draft: false
          prerelease: false
          files: |
            artifacts/release-windows/release-windows-${{ needs.extract-version.outputs.release_version }}.zip
            artifacts/release-linux/release-linux-${{ needs.extract-version.outputs.release_version }}.zip
          body: |
            ## Release v${{ needs.extract-version.outputs.release_version }}
            
            This is the stable release from the main branch.
            
            ### Installation
            
            #### Windows
            Download `release-windows-${{ needs.extract-version.outputs.release_version }}.zip` and extract it to your desired location.
            
            #### Linux
            Download `release-linux-${{ needs.extract-version.outputs.release_version }}.zip` and extract it to your desired location.
            
            ### What's New
            This release includes all features that were validated in the staging branch.
            
            ### Verification
            - ✅ All tests passed
            - ✅ Build artifacts created successfully
            - ✅ Version: ${{ needs.extract-version.outputs.release_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-release:
    runs-on: ubuntu-latest
    needs: [extract-version, create-github-release]
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a v${{ needs.extract-version.outputs.release_version }} -m "Release v${{ needs.extract-version.outputs.release_version }}"
          git push origin v${{ needs.extract-version.outputs.release_version }}
