name: Main Branch Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.get_version.outputs.release_version }}
      already_released: ${{ steps.get_version.outputs.already_released }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release version from RC tag
        id: get_version
        run: |
          # Letzten RC-Tag verwenden, der von HEAD aus erreichbar ist (der von staging
          # promotete Release-Kandidat). Fallback: global letzter RC-Tag.
          RC_TAG=$(git tag --merged HEAD -l 'v*-RC.*' | sort -V | tail -n 1)
          if [ -z "$RC_TAG" ]; then
            RC_TAG=$(git tag -l 'v*-RC.*' | sort -V | tail -n 1)
          fi

          if [ -n "$RC_TAG" ]; then
            CLEAN_VERSION=${RC_TAG#v}
            RELEASE_VERSION=${CLEAN_VERSION%-RC*}
          else
            # Kein RC-Tag vorhanden: semantischen Bump aus der Historie berechnen.
            bash .github/scripts/compute-version.sh >/dev/null
            RELEASE_VERSION=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -Ev -- '-' | sort -V | tail -n 1)
            RELEASE_VERSION=${RELEASE_VERSION#v}
            RELEASE_VERSION=${RELEASE_VERSION:-1.0.0}
          fi

          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            ALREADY_RELEASED=true
            echo "::warning::Version v${RELEASE_VERSION} ist bereits released (Tag existiert). Release wird uebersprungen."
          else
            ALREADY_RELEASED=false
          fi

          {
            echo "release_version=$RELEASE_VERSION"
            echo "already_released=$ALREADY_RELEASED"
          } >> $GITHUB_OUTPUT
          echo "Release-Version: $RELEASE_VERSION (aus Tag: ${RC_TAG:-<keiner>})"

  build-release:
    runs-on: ubuntu-latest
    needs: extract-version
    if: needs.extract-version.outputs.already_released == 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer/VideoWebPlayer.csproj

      - name: Build solution
        run: dotnet build VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --no-restore /p:NoWarn=NU1903

      - name: Update version to release version
        run: |
          RELEASE_VERSION="${{ needs.extract-version.outputs.release_version }}"
          
          # Update AssemblyVersion and FileVersion in project files
          find . -name "*.csproj" -type f -exec sed -i "s/<AssemblyVersion>.*<\/AssemblyVersion>/<AssemblyVersion>${RELEASE_VERSION}<\/AssemblyVersion>/g" {} \;
          find . -name "*.csproj" -type f -exec sed -i "s/<FileVersion>.*<\/FileVersion>/<FileVersion>${RELEASE_VERSION}<\/FileVersion>/g" {} \;
          
          # Update Version element to release version (without RC suffix)
          for proj in $(find . -name "*.csproj" -type f); do
            if grep -q "<Version>" "$proj"; then
              sed -i "s/<Version>.*<\/Version>/<Version>${RELEASE_VERSION}<\/Version>/g" "$proj"
            fi
          done

      - name: Publish Windows artifact
        run: |
          dotnet publish VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --runtime win-x64 --self-contained -o artifacts/windows /p:Version=${{ needs.extract-version.outputs.release_version }} /p:NoWarn=NU1903

      - name: Publish Linux artifact
        run: |
          dotnet publish VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --runtime linux-x64 --self-contained -o artifacts/linux /p:Version=${{ needs.extract-version.outputs.release_version }} /p:NoWarn=NU1903

      - name: Create release zip (Windows)
        run: |
          cd artifacts/windows
          zip -r ../../release-windows-${{ needs.extract-version.outputs.release_version }}.zip .

      - name: Create release zip (Linux)
        run: |
          cd artifacts/linux
          zip -r ../../release-linux-${{ needs.extract-version.outputs.release_version }}.zip .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-windows-${{ needs.extract-version.outputs.release_version }}.zip

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-linux-${{ needs.extract-version.outputs.release_version }}.zip

  final-tests:
    runs-on: ubuntu-latest
    needs: extract-version
    if: needs.extract-version.outputs.already_released == 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj

      - name: Build test project
        run: dotnet build VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release /p:NoWarn=NU1903

      - name: Run final test suite
        run: dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=final-test-results.trx"

      - name: Run MAUI tests
        run: dotnet test VideoWebPlayer.Maui.Tests/VideoWebPlayer.Maui.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=final-maui-test-results.trx"
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-test-results
          path: '**/*final-test-results.trx'

  create-github-release:
    runs-on: ubuntu-latest
    needs: [extract-version, build-release, final-tests]
    if: success() && needs.extract-version.outputs.already_released == 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.extract-version.outputs.release_version }}
          name: Release v${{ needs.extract-version.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            artifacts/release-windows/release-windows-${{ needs.extract-version.outputs.release_version }}.zip
            artifacts/release-linux/release-linux-${{ needs.extract-version.outputs.release_version }}.zip
          body: |
            ## Release v${{ needs.extract-version.outputs.release_version }}
            
            This is the stable release from the main branch.
            
            ### Installation
            
            #### Windows
            Download `release-windows-${{ needs.extract-version.outputs.release_version }}.zip` and extract it to your desired location.
            
            #### Linux
            Download `release-linux-${{ needs.extract-version.outputs.release_version }}.zip` and extract it to your desired location.
            
            ### What's New
            This release includes all features that were validated in the staging branch.
            
            ### Verification
            - ✅ All tests passed
            - ✅ Build artifacts created successfully
            - ✅ Version: ${{ needs.extract-version.outputs.release_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release-tag:
    runs-on: ubuntu-latest
    needs: [extract-version, create-github-release]
    if: success() && needs.extract-version.outputs.already_released == 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag exists
        run: |
          # Der Tag wird von der Release-Action erzeugt; hier wird nur geprueft,
          # dass er vorhanden ist (kein zweites, konfliktbehaftetes Anlegen).
          TAG="v${{ needs.extract-version.outputs.release_version }}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --no-tags
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null
          echo "Tag ${TAG} vorhanden."

  backmerge-to-staging:
    # Nach dem Release wird main via PR zurueck nach staging gemergt, damit der
    # Release-Tag/-Stand auf staging bekannt ist und der naechste Staging-Push die
    # Version semantisch (statt nur den RC-Zaehler) weiterzaehlt.
    runs-on: ubuntu-latest
    needs: [extract-version, create-github-release]
    if: always() && needs.create-github-release.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if staging is behind main
        id: diff
        run: |
          git fetch origin staging --no-tags
          COUNT=$(git rev-list origin/staging..HEAD --count)
          echo "commits_ahead=$COUNT" >> $GITHUB_OUTPUT
          echo "main ist $COUNT Commit(s) vor staging."

      - name: Ensure automated-backmerge label exists
        if: steps.diff.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create automated-backmerge --color "1D76DB" --description "Automatischer Back-Merge von main nach staging" --force

      - name: Create back-merge pull request
        if: steps.diff.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.extract-version.outputs.release_version }}
        run: |
          EXISTING=$(gh pr list --base staging --head main --state open --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "Es existiert bereits ein offener Back-Merge-PR main -> staging."
            exit 0
          fi
          gh pr create \
            --base staging \
            --head main \
            --title "Back-Merge: Release v${RELEASE_VERSION} von main nach staging" \
            --body "Automatischer Back-Merge nach dem Release **v${RELEASE_VERSION}**.

          Dadurch kennt \`staging\` den released Stand inkl. Tag \`v${RELEASE_VERSION}\`, sodass der naechste Push auf staging die Version anhand der semantischen Regeln (Conventional Commits) hochzaehlt und nicht nur den RC-Zaehler." \
            --label "automated-backmerge"
