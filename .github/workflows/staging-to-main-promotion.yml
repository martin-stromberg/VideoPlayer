name: Staging to Main Promotion

# Nach erfolgreichem Durchlauf von "Staging Branch CI" auf staging (Push-Event) wird geprueft, ob main
# gegenueber staging zurueckliegt. Falls ja, wird automatisch ein Draft-PR staging -> main
# erstellt. Der PR benoetigt manuellen Review und Merge durch einen Maintainer; Branch-Protection
# auf main erzwingt mindestens ein Approval.

on:
  workflow_run:
    workflows: ["Staging Branch CI"]
    types: [completed]
    branches: [staging]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: staging-to-main-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch main
        run: git fetch origin main
        shell: pwsh

      - name: Check if main is behind staging
        id: diff
        run: |
          # Bei einem reinen Back-Merge (Tree identisch zu main) gibt es nichts zu promoten.
          $changed = git diff --name-only origin/main HEAD
          if ([string]::IsNullOrWhiteSpace(($changed -join ''))) {
            Write-Host "Tree ist identisch zu main (Back-Merge) - keine Promotion notwendig."
            "commits_ahead=0" | Add-Content -Path $env:GITHUB_OUTPUT
          } else {
            $count = git rev-list origin/main..HEAD --count
            "commits_ahead=$count" | Add-Content -Path $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Ensure automated-promotion label exists
        if: steps.diff.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create automated-promotion --color "0E8A16" --description "Automatisierter PR von staging nach main" --force
        shell: pwsh

      - name: Create promotion pull request
        if: steps.diff.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh pr list --base main --head staging --state open --json number | ConvertFrom-Json
          if ($existing.Count -eq 0) {
            gh pr create `
              --base main `
              --head staging `
              --title "Automated promotion from staging to main" `
              --body "Automated promotion from staging to main. Enthaelt alle Aenderungen, die auf staging integriert und erfolgreich getestet wurden. Benoetigt manuellen Review und Merge durch einen Maintainer." `
              --draft `
              --label "automated-promotion"
          } else {
            Write-Host "An open promotion PR from staging to main already exists (#$($existing[0].number))."
          }
        shell: pwsh