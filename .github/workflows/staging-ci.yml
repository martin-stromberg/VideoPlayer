name: Staging Branch CI

on:
  push:
    branches: [ staging ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer/VideoWebPlayer.csproj

      - name: Build solution
        run: dotnet build VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --no-restore /p:NoWarn=NU1903

  full-integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj

      - name: Build test project
        run: dotnet build VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release /p:NoWarn=NU1903

      - name: Run all integration tests
        run: dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category=Integration" --logger "trx;LogFileName=full-integration-results.trx"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-integration-test-results
          path: '**/full-integration-results.trx'

  code-coverage:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj

      - name: Build test project
        run: dotnet build VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release /p:NoWarn=NU1903

      - name: Run tests with coverage
        run: |
          dotnet tool install -g dotnet-coverage
          dotnet-coverage collect 'dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release --no-build' -f cobertura -o 'coverage/' || true

      - name: Upload coverage data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: coverage/

  quality-gates:
    runs-on: ubuntu-latest
    needs: [build, code-coverage]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer/VideoWebPlayer.csproj

      - name: Dependency vulnerability check
        run: |
          cd VideoWebPlayer
          dotnet list package --vulnerable --include-transitive

      - name: Code formatting
        run: |
          dotnet tool install -g dotnet-format
          dotnet format VideoWebPlayer/VideoWebPlayer.csproj

  create-prerelease:
    runs-on: ubuntu-latest
    needs: [full-integration-tests, quality-gates]
    if: always() && needs.full-integration-tests.result == 'success' && needs.quality_gates.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer/VideoWebPlayer.csproj

      - name: Build release artifacts
        run: |
          dotnet publish VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --runtime win-x64 --self-contained -o artifacts/windows /p:NoWarn=NU1903
          dotnet publish VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --runtime linux-x64 --self-contained -o artifacts/linux /p:NoWarn=NU1903

      - name: Create release zip (Windows)
        run: |
          cd artifacts/windows
          zip -r ../../release-windows.zip .

      - name: Create release zip (Linux)
        run: |
          cd artifacts/linux
          zip -r ../../release-linux.zip .

      - name: Create prerelease
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-RC.${{ github.run_number }}
          name: Pre-release v1.0.0-RC.${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            release-windows.zip
            release-linux.zip
          body: |
            ## Pre-release v1.0.0-RC.${{ github.run_number }}
            
            This is a pre-release from the staging branch. All quality gates have passed.
            
            ### Changes
            - See commit history for details
            
            ### Artifacts
            - Windows: release-windows.zip
            - Linux: release-linux.zip
            
            ### Installation
            Download the appropriate zip file for your platform and extract it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
