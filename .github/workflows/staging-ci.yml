name: Staging Branch CI

# CI/CD Pipeline for staging branch - validates code quality and creates pre-releases

on:
  push:
    branches: [ staging ]

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-backmerge:
    # Ein reiner Back-Merge (main -> staging nach einem Release) bringt keinen neuen
    # Code: der Tree ist identisch zu main. Tests, Quality-Gates und Prerelease
    # werden dann uebersprungen.
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether push is a pure back-merge from main
        id: check
        run: |
          git fetch origin main --no-tags
          if git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> $GITHUB_OUTPUT
            echo "::notice::Reiner Back-Merge von main erkannt (Tree identisch) - Tests, Quality-Gates und Prerelease werden uebersprungen."
          else
            echo "is_backmerge=false" >> $GITHUB_OUTPUT
            echo "Aenderungen gegenueber main vorhanden - vollstaendige Pipeline laeuft."
          fi

  version:
    runs-on: ubuntu-latest
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    outputs:
      next_version: ${{ steps.semver.outputs.next_version }}
      bump: ${{ steps.semver.outputs.bump }}
      rc_version: ${{ steps.semver.outputs.rc_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semantic version
        id: semver
        run: bash .github/scripts/compute-version.sh

  build:
    runs-on: ubuntu-latest
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer/VideoWebPlayer.csproj

      - name: Build solution
        run: dotnet build VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --no-restore /p:NoWarn=NU1903

  full-integration-tests:
    runs-on: ubuntu-latest
    needs: [detect-backmerge, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj

      - name: Build test project
        run: dotnet build VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release /p:NoWarn=NU1903

      - name: Run all integration tests
        run: dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category=Integration" --logger "trx;LogFileName=full-integration-results.trx"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-integration-test-results
          path: '**/full-integration-results.trx'

  code-coverage:
    runs-on: ubuntu-latest
    needs: [detect-backmerge, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj

      - name: Build test project
        run: dotnet build VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release /p:NoWarn=NU1903

      - name: Run tests with coverage
        run: |
          dotnet tool install -g dotnet-coverage
          dotnet-coverage collect 'dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --configuration Release --no-build' -f cobertura -o 'coverage/' || true

      - name: Upload coverage data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: coverage/

  quality-gates:
    runs-on: ubuntu-latest
    needs: [detect-backmerge, build, code-coverage]
    if: always() && needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.build.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer/VideoWebPlayer.csproj

      - name: Dependency vulnerability check
        run: |
          cd VideoWebPlayer
          dotnet list package --vulnerable --include-transitive

      - name: Code formatting
        run: |
          dotnet tool install -g dotnet-format
          dotnet format VideoWebPlayer/VideoWebPlayer.csproj

  create-prerelease:
    runs-on: ubuntu-latest
    needs: [detect-backmerge, version, full-integration-tests, quality-gates]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.full-integration-tests.result == 'success' && needs.quality-gates.result == 'success'
    env:
      RC_VERSION: ${{ needs.version.outputs.rc_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VideoWebPlayer/VideoWebPlayer.csproj

      - name: Build release artifacts
        run: |
          dotnet publish VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --runtime win-x64 --self-contained -o artifacts/windows /p:Version=$RC_VERSION /p:NoWarn=NU1903
          dotnet publish VideoWebPlayer/VideoWebPlayer.csproj --configuration Release --runtime linux-x64 --self-contained -o artifacts/linux /p:Version=$RC_VERSION /p:NoWarn=NU1903

      - name: Create release zip (Windows)
        run: |
          cd artifacts/windows
          zip -r ../../release-windows.zip .

      - name: Create release zip (Linux)
        run: |
          cd artifacts/linux
          zip -r ../../release-linux.zip .

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.rc_version }}
          name: Pre-release v${{ needs.version.outputs.rc_version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            release-windows.zip
            release-linux.zip
          body: |
            ## Pre-release v${{ needs.version.outputs.rc_version }}

            This is a pre-release from the staging branch. All quality gates have passed.

            ### Version
            - Naechste stabile Version: `${{ needs.version.outputs.next_version }}` (Bump: `${{ needs.version.outputs.bump }}`)
            - Ermittelt aus dem letzten stabilen Tag und den Conventional Commits auf staging.

            ### Changes
            - See commit history for details

            ### Artifacts
            - Windows: release-windows.zip
            - Linux: release-linux.zip

            ### Installation
            Download the appropriate zip file for your platform and extract it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}