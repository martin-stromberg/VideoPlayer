name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

# Prevents parallel release runs (e.g. a fast merge to main followed shortly after by a
# manually pushed tag): resolve-release-version.mjs decides on a single target tag/version
# by querying the GitHub API and existing tags - without serialization, two concurrent runs
# could race for the same version or fail to create the release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        # Generalized asset-repair mechanism (ci-target-schema.md section 4.10): classifies
        # this run as automatic (branch push to main, version via semantic-release --dry-run)
        # or manual (a pushed vX.Y.Z tag), then checks whether a GitHub release for the
        # resolved tag already exists and whether it already has all expected assets. Missing
        # assets are repaired in place instead of duplicating the release. See
        # scripts/resolve-release-version.mjs.
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-release-version.mjs

      - name: Check out release tag for asset repair
        # Only relevant for the repair path: a previous run created the tag/release but was
        # interrupted before all assets were uploaded. This checks out the exact tagged
        # commit so the rebuilt assets match the already-published release, instead of
        # rebuilding from whatever commit triggered this run.
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'upload-existing'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git checkout --detach "$RELEASE_TAG"

          expected_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$expected_commit" ]; then
            echo "::error::Release tag checkout did not resolve to the tagged commit."
            exit 1
          fi

      - name: Restore solution
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: dotnet restore VideoPlayer.sln

      - name: Build test project
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: dotnet build VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --no-restore -c Release -p:NoWarn=NU1903

      - name: Install Playwright browsers
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: pwsh VideoWebPlayer.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Release gate - full test suite
        # Safety net now that there is no dedicated PR-gate workflow against main anymore
        # (see ci-target-schema.md section 11, item 2): PRs against main can only come from
        # staging, which was already fully validated by pr-staging-ci.yml/staging-ci.yml, so
        # this re-run mainly guards against a race between that validation and the actual
        # merge or tag push. Runs for both automatic and manual-tag releases, but not for the
        # asset-repair path, which only needs to rebuild an already-validated release.
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        run: dotnet test VideoWebPlayer.Tests/VideoWebPlayer.Tests.csproj --no-build -c Release --logger "trx;LogFileName=final-test-results.trx" --logger "console;verbosity=normal"

      - name: Upload release-gate test results
        if: always() && steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-release
          path: VideoWebPlayer.Tests/TestResults/*.trx
          retention-days: 14

      - name: Build and package
        if: steps.version.outputs.released == 'true'
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ steps.version.outputs.version }}
          release-tag: ${{ steps.version.outputs.tag }}

      - name: Create automatic GitHub release
        # Goes through semantic-release's own publish pipeline (releasePlugins in
        # release.config.js: commit-analyzer, release-notes-generator, then
        # @semantic-release/github, which creates the tag, the GitHub release and uploads the
        # assets listed via RELEASE_ASSET_PATHS/RELEASE_MANIFEST_PATH below). Manual-tag and
        # asset-repair releases intentionally stay on the gh CLI / softprops action below:
        # semantic-release only knows about conventional-commit-driven releases on configured
        # branches, not about a tag someone pushed manually or a one-off missing-asset repair.
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create' && steps.version.outputs.release_kind == 'automatic'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ASSET_PATHS: release-win-x64.zip;release-linux-x64.zip
          RELEASE_MANIFEST_PATH: update.json
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run release

      - name: Create manual-tag GitHub release
        # softprops/action-gh-release is pinned to a commit SHA rather than a mutable tag,
        # matching the project-wide supply-chain-hardening standard (ci-target-schema.md
        # section 6.4).
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'create' && steps.version.outputs.release_kind == 'manual'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-win-x64.zip
            release-linux-x64.zip
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload missing assets to existing release
        if: steps.version.outputs.released == 'true' && steps.version.outputs.release_action == 'upload-existing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          gh release upload "$tag" release-win-x64.zip release-linux-x64.zip update.json --clobber
